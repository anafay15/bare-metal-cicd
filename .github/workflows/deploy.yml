name: Deploy to Production VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # THIS is the crucial line. It routes the job to the runner inside your VM.
    runs-on: self-hosted 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Deploy Container
        run: |
          cd /home/vboxuser/project1
          docker compose up -d --build
          docker system prune -f